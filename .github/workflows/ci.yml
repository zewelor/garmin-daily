name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint Dockerfile
        uses: immanuwell/dockerfile-roast@1c87b2aa189338c24db4acde40864dae8994de8f # 1.7.0
        with:
          no-roast: true
          # Keep the tool image revision in sync with the pinned action release.
          image-tag: 1.7.0@sha256:4f31be49f26804c0a2f8a0ab0ae578719e30376323e8fd5951c6dcc79a478b40

      - name: Run unit tests
        run: go test ./...

      - name: Check Go formatting
        run: |
          files=$(gofmt -l ./cmd ./garmin)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Start PostgreSQL
        run: docker compose --env-file /dev/null -p garmin-daily-integration up --detach --wait db

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://garmin_daily:dev-only-password@localhost:15432/garmin_daily?sslmode=disable
        run: go test -tags integration -v ./...

      - name: Build container image
        run: docker build --pull --tag garmin-daily:local .

      - name: Smoke-test container migration
        run: docker compose --env-file /dev/null -p garmin-daily-integration --profile app run --rm app migrate

      - name: Stop PostgreSQL
        if: always()
        run: docker compose --env-file /dev/null -p garmin-daily-integration down --volumes --remove-orphans

  publish:
    needs: verify
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: org.opencontainers.image.licenses=MIT
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=garmin-daily
          cache-to: type=gha,mode=max,scope=garmin-daily

      - name: Report published digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove old images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ github.event.repository.name }}
          keep-n-tagged: 10
          keep-n-untagged: 10
          exclude-tags: latest
          delete-partial-images: true
