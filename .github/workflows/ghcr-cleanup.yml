name: GHCR cleanup

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview which images would be deleted
        type: boolean
        default: true

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ghcr-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      packages: write
    steps:
      - name: Require the default branch for manual cleanup
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run cleanup from the default branch."
            exit 1
          fi

      - name: Remove old images
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          package: ${{ github.event.repository.name }}
          keep-n-tagged: 10
          keep-n-untagged: 10
          exclude-tags: latest
          delete-partial-images: true
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
